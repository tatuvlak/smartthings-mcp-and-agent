[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartthings-mcp-and-agent"
version = "0.1.0"
description = "Production-quality MCP server and AI agent framework for smart home ecosystems"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Smart Home MCP Contributors"}
]
keywords = ["mcp", "model-context-protocol", "smart-home", "smartthings", "ai-agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25.0",
    "asyncio-contextmanager>=1.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pytest-mock>=3.10",
]
mcp = [
    "mcp>=0.1.0",
]
llm-openai = [
    "openai>=1.0.0",
]
llm-anthropic = [
    "anthropic>=0.7.0",
]
llm-ollama = [
    "ollama>=0.1.0",
]
all = [
    "smartthings-mcp-and-agent[dev,mcp,llm-openai,llm-anthropic,llm-ollama]"
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
